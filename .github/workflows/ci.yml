name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate site from source
        run: |
          python3 generate.py
          python3 build_spa.py

      - name: Fail if generated output is out of sync with committed files
        run: |
          if ! git diff --exit-code -- '*.html' '*.css' '*.js'; then
            echo "::error::Generated files differ from committed output. Run 'python3 generate.py && python3 build_spa.py' locally and commit the result."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check inline JS syntax in the single-file SPA
        run: |
          python3 -c "
          html = open('comet-foundry-spa.html').read()
          start = html.index('<script>') + len('<script>')
          end = html.index('</script>')
          open('_spa_extracted.js', 'w').write(html[start:end])
          "
          node --check _spa_extracted.js

      - name: Check script.js and api/subscribe.js syntax
        run: |
          node --check script.js
          node --check api/subscribe.js

      - name: Validate JSON config files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('vercel.json'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest.json'))"
          node -e "JSON.parse(require('fs').readFileSync('package.json'))"

      - name: Validate JSON-LD structured data is well-formed
        run: |
          python3 -c "
          import re, json, glob
          for f in sorted(glob.glob('*.html')):
              if f == 'comet-foundry-spa.html':
                  continue
              html = open(f, encoding='utf-8').read()
              for block in re.findall(r'<script type=\"application/ld\+json\">(.*?)</script>', html, re.S):
                  json.loads(block)
          print('all JSON-LD blocks valid')
          "

      - name: Check internal links resolve to real files
        run: |
          python3 - <<'EOF'
          import re, glob, sys

          ok = True
          html_files = set(glob.glob("*.html"))

          for f in sorted(html_files):
              content = open(f, encoding="utf-8").read()
              for href in re.findall(r'href="([a-zA-Z0-9_\-]+\.html)"', content):
                  if href not in html_files:
                      print(f"::error file={f}::Broken internal link to {href}")
                      ok = False

          sys.exit(0 if ok else 1)
          EOF
